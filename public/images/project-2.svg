  <circle cx="24" cy="16" r="4" fill="#ff5f56"/>
  <circle cx="38" cy="16" r="4" fill="#ffbd2e"/>
  <circle cx="52" cy="16" r="4" fill="#27c93f"/>

  <!-- Candlesticks / Fintech Chart -->
